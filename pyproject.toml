[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vintagexif"
version = "0.1.0"
description = "Set photo and video recording dates from filenames and folders"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["python-dateutil", "piexif", "PyExifTool"]

[project.optional-dependencies]
dev = ["pytest", "pre-commit", "pillow"]

[project.scripts]
vintagexif = "vintagexif:main"

[tool.setuptools]
py-modules = ["vintagexif"]
